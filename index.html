<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lector Antoniana</title>
  
  <!-- ZXing para leer códigos -->
  <script type="module">
    import { BrowserBarcodeReader } from "https://cdn.jsdelivr.net/npm/@zxing/browser@0.0.10/+esm";

    document.addEventListener("DOMContentLoaded", async () => {
      const videoElement = document.getElementById("scanner");
      const resultado = document.getElementById("resultado");

      const codeReader = new BrowserBarcodeReader();

      try {
        const devices = await BrowserBarcodeReader.listVideoInputDevices();
        const selectedDeviceId = devices[0]?.deviceId;

        if (!selectedDeviceId) throw new Error("No se encontró cámara");

        codeReader.decodeFromVideoDevice(selectedDeviceId, videoElement, (result, err) => {
          if (result) {
            const now = new Date().toLocaleString();
            const row = document.createElement("tr");
            row.innerHTML = `
              <td class="border px-2 py-1">${result.getText()}</td>
              <td class="border px-2 py-1">${now}</td>
            `;
            resultado.prepend(row);
          }
        });
      } catch (error) {
        alert("Error al acceder a la cámara: " + error.message);
        console.error(error);
      }
    });
  </script>

  <!-- Tailwind CSS -->
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">

  <style>
    :root {
      --primary-blue: #0c3553;
      --primary-brown: #3C2713;
      --light-bg: #F0F5F5;
      --white: #FFFFFF;
    }

    body {
      background-color: var(--light-bg);
      font-family: 'Segoe UI', sans-serif;
    }

    .antoniana-header {
      background-color: var(--primary-blue);
      color: var(--white);
    }

    .antoniana-title {
      color: var(--primary-blue);
    }

    .antoniana-table thead {
      background-color: var(--primary-brown);
      color: var(--white);
    }
  </style>
</head>

<body class="p-4 text-gray-900">
  <div class="max-w-2xl mx-auto">
    <h1 class="text-2xl font-bold mb-4 text-center antoniana-header py-3 rounded-lg shadow">
      📷 Lector de Códigos - Juventud Antoniana
    </h1>

    <div class="rounded-xl overflow-hidden mb-4 bg-black max-w-full">
      <video id="scanner" class="w-full h-64 rounded-lg bg-black" autoplay playsinline muted></video>
    </div>

    <div class="bg-white rounded-lg shadow p-4">
      <h2 class="text-lg font-semibold mb-3 antoniana-title">📋 Últimos Escaneos</h2>
      <div class="overflow-x-auto">
        <table class="w-full text-sm antoniana-table">
          <thead>
            <tr>
              <th class="px-2 py-1 text-left">Código</th>
              <th class="px-2 py-1 text-left">Fecha y Hora</th>
            </tr>
          </thead>
          <tbody id="resultado"></tbody>
        </table>
      </div>
    </div>
  </div>
</body>
</html>
