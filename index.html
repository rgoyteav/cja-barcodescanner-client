<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lector de Códigos - Juventud Antoniana</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    :root {
      --primary-blue: #0c3553;
      --primary-brown: #3C2713;
      --light-bg: #F0F5F5;
      --white: #FFFFFF;
    }
    body {
      background-color: var(--light-bg);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start p-4">

  <!-- Título -->
  <div class="bg-[var(--primary-blue)] text-white px-6 py-3 rounded-lg shadow mb-4">
    <h1 class="text-xl font-bold flex items-center gap-2">
      📷 Lector de Códigos - Juventud Antoniana
    </h1>
  </div>

  <!-- Video (lector) -->
  <div id="scanner-container" class="w-full max-w-xl rounded overflow-hidden mb-4">
    <video
      id="scanner"
      class="w-full h-64 rounded-lg bg-black object-cover"
      autoplay
      playsinline
      muted
    ></video>
  </div>

  <!-- Tabla de escaneos -->
  <div class="bg-white p-4 rounded-lg shadow w-full max-w-xl">
    <h2 class="text-lg font-bold text-[var(--primary-blue)] mb-2">📋 Últimos Escaneos</h2>
    <table class="w-full text-sm text-left">
      <thead class="bg-[var(--primary-brown)] text-white">
        <tr>
          <th class="px-2 py-1">Código</th>
          <th class="px-2 py-1">Fecha y Hora</th>
        </tr>
      </thead>
      <tbody id="scan-results">
        <!-- Aquí se insertan los escaneos -->
      </tbody>
    </table>
  </div>

  <script>
    const video = document.getElementById('scanner');

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment' }, // Usa cámara trasera si hay
          audio: false
        });
        video.srcObject = stream;
      } catch (err) {
        alert("No se pudo acceder a la cámara: " + err.message);
      }
    }

    // Simula escaneo para demo: agrega códigos aleatorios (reemplazar luego con lector real)
    function simulateScan() {
      const codigo = 'CJA-' + Math.floor(Math.random() * 100000);
      const fecha = new Date().toLocaleString();
      const fila = `<tr><td class="px-2 py-1 font-medium">${codigo}</td><td class="px-2 py-1">${fecha}</td></tr>`;
      document.getElementById("scan-results").insertAdjacentHTML('afterbegin', fila);
    }

    // Inicializa cámara al cargar
    window.addEventListener('DOMContentLoaded', () => {
      startCamera();

      // DEMO: escaneo simulado cada 5s (borrá esto cuando uses lector real)
      setInterval(simulateScan, 5000);
    });
  </script>

</body>
</html>
